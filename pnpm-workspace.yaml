packages:
  - 'packages/*'

# Dependencies whose install/postinstall scripts may run. Everything else with a
# build script is skipped (pnpm's default since v10; pnpm 11 removed the older
# onlyBuiltDependencies spelling).
allowBuilds:
  esbuild: true

# Security overrides — mirrored into pnpm-lock.yaml's `overrides` block. Keep the
# two in sync: a frozen install fails on any mismatch.
overrides:
  vite: 7.3.6
  path-to-regexp: '>=8.4.0'
  brace-expansion: '>=5.0.6'
  hono: ^4.12.25
  fast-uri: ^3.1.6
  qs: ^6.15.2
  ip-address: ^10.1.1
  esbuild: ^0.28.2
  # GHSA-27r3-jxmh-p828: body-parser 2.x DoS via trailing bytes; patched 2.4.0.
  # Transitive via express and @modelcontextprotocol/sdk, both accepting ^2.
  body-parser: ^2.4.0
  # GHSA-mrhx-c7xc-m3w5: zod <4.6.6 memory exhaustion; no patched 3.x line.
  # In-range for every consumer: the MCP SDK declares `^3.25 || ^4.0` and
  # zod-to-json-schema `^3.25.28 || ^4`.
  zod: ^4.6.7
