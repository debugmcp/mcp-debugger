name: 'Debug Failing Test (mcp-debugger)'
description: >-
  Root-cause a failing test with a real step-through debugger driven by Claude,
  and post the analysis as a PR comment. Experimental.
branding:
  icon: 'crosshair'
  color: 'red'

inputs:
  anthropic-api-key:
    description: 'Anthropic API key used by the Claude Code CLI'
    required: true
  test-command:
    description: 'Command that reproduces the failure (e.g. "pytest tests/test_orders.py -x")'
    required: true
  language:
    description: 'Debug language: python, javascript, ruby, rust, go, java, dotnet'
    required: false
    default: 'python'
  test-file:
    description: 'Path to the failing test file, if known — narrows the investigation'
    required: false
    default: ''
  post-comment:
    description: 'Post the analysis as a PR comment (requires pull_request context)'
    required: false
    default: 'true'
  github-token:
    description: 'Token used to post the PR comment'
    required: false
    default: ${{ github.token }}

outputs:
  analysis-file:
    description: 'Path to the generated root-cause analysis markdown'
    value: ${{ steps.debug.outputs.analysis-file }}

runs:
  using: 'composite'
  steps:
    - name: Install Claude Code CLI and register mcp-debugger
      shell: bash
      run: |
        npm install -g @anthropic-ai/claude-code
        claude mcp add-json mcp-debugger \
          '{"type":"stdio","command":"npx","args":["-y","@debugmcp/mcp-debugger","stdio"]}'

    - name: Reproduce the failure
      id: repro
      shell: bash
      run: |
        set +e
        ${{ inputs.test-command }} > test-output.txt 2>&1
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"
        tail -c 20000 test-output.txt > test-output-tail.txt

    - name: Debug with mcp-debugger
      id: debug
      if: steps.repro.outputs.exit-code != '0'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        TEST_COMMAND: ${{ inputs.test-command }}
        TEST_FILE: ${{ inputs.test-file }}
        DEBUG_LANGUAGE: ${{ inputs.language }}
      run: |
        PROMPT=$(cat <<'EOF'
        A test in this repository is failing. Your job is to find the ROOT CAUSE using
        the mcp-debugger MCP tools (real breakpoints and variable inspection), not by
        guessing from the source.

        Failing command: __TEST_COMMAND__
        Failing test file (may be empty): __TEST_FILE__
        Language: __DEBUG_LANGUAGE__
        The failure output is in test-output-tail.txt — read it first.

        Method:
        1. Read the failure output and the relevant source. Form a hypothesis.
        2. create_debug_session, set breakpoints at last-known-good and first-known-bad
           points, start_debugging the test entry point, and inspect real values
           (get_stack_trace -> get_scopes -> get_variables / evaluate_expression).
        3. Bisect until you can name the exact line where expectation diverges from
           reality, and WHY. Always close_debug_session when done.
        4. Write your analysis to mcp-debugger-analysis.md with sections:
           "## Root cause" (2-3 sentences, name file:line), "## Evidence" (the actual
           runtime values you observed), "## Suggested fix" (minimal diff suggestion).
           Do NOT modify any source files.
        EOF
        )
        PROMPT="${PROMPT/__TEST_COMMAND__/$TEST_COMMAND}"
        PROMPT="${PROMPT/__TEST_FILE__/$TEST_FILE}"
        PROMPT="${PROMPT/__DEBUG_LANGUAGE__/$DEBUG_LANGUAGE}"
        claude -p "$PROMPT" \
          --allowedTools "mcp__mcp-debugger__*" "Read" "Glob" "Grep" "Write" \
          --max-turns 60 || echo "claude run finished with non-zero exit"
        if [ -f mcp-debugger-analysis.md ]; then
          echo "analysis-file=mcp-debugger-analysis.md" >> "$GITHUB_OUTPUT"
        fi

    - name: Post PR comment
      if: >-
        steps.repro.outputs.exit-code != '0' &&
        inputs.post-comment == 'true' &&
        github.event_name == 'pull_request' &&
        steps.debug.outputs.analysis-file != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        {
          echo "## 🔬 mcp-debugger root-cause analysis"
          echo ""
          cat mcp-debugger-analysis.md
          echo ""
          echo "---"
          echo "_Generated by [debug-failing-test](https://github.com/debugmcp/mcp-debugger/tree/main/.github/actions/debug-failing-test) — a real debugger, driven by an agent, in CI._"
        } > pr-comment.md
        gh pr comment ${{ github.event.pull_request.number }} \
          --repo ${{ github.repository }} \
          --body-file pr-comment.md

    - name: Fail the job if the test failed
      if: steps.repro.outputs.exit-code != '0'
      shell: bash
      run: |
        echo "Test command failed (exit ${{ steps.repro.outputs.exit-code }}); see analysis above."
        exit 1
